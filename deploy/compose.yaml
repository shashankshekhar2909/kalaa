# Kalaa site (/) + Storybook (/storybook/) on deploy-server port 8100; public via kalaa.buildwithshashank.com (Cloudflare tunnel).
# Static files only; updated by scripts/deploy-storybook.sh.
name: kalaa-storybook
services:
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:8100:8100"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
    network_mode: bridge # deploy-server has no free address pools for new compose networks
    mem_limit: 64m
    read_only: true
    tmpfs:
      - /data
      - /config
